[tool.poetry]
name = "aiohh"
version = "1.0.1"
description = "Asynchronous API wrapper for hh.ru"
authors = ["Danila Novichikhin <novichixinn@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/novichikhin/aiohh"
packages = [{ include = "aiohh" }]
keywords = ["hh.ru", "headhunter", "api", "asyncio", "aiohttp"]
classifiers = [
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.12"
pydantic = "^2.11"

[tool.poetry.group.dev.dependencies]
black = "^26.5"
ruff = "^0.16"
mypy = "^2.3"
pre-commit = "^4.6"
pytest = "^9.1"
pytest-asyncio = "^1.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
