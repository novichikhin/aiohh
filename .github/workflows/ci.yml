name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pipx install poetry
          poetry install

      - name: Ruff
        run: poetry run ruff check aiohh tests examples

      - name: Black
        run: poetry run black --check aiohh tests examples

      - name: Mypy
        run: poetry run mypy aiohh tests

      - name: Pytest
        run: poetry run pytest
